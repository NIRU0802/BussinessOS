appId: com.gr8.businessos.pos
productName: Business OS POS
copyright: Copyright © 2026 Business OS

directories:
  output: dist-installer
  buildResources: build

files:
  - out/**/*
  - package.json
  - '!**/*.map'

icon: build/icon.png

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  # certificateFile: "ADD YOUR CERTIFICATE PATH HERE (.pfx)"
  # certificatePassword: "ADD YOUR CERTIFICATE PASSWORD HERE (use env var, not literal)"
  # signingHashAlgorithms: ["sha256"]
  # rfc3161TimeStampServer: "http://timestamp.digicert.com"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Business OS POS
  uninstallDisplayName: Business OS POS
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.business
  hardenedRuntime: true
  gatekeeperAssess: false
  # identity: "ADD YOUR APPLE DEVELOPER ID HERE (Developer ID Application: Your Name (TEAMID))"
  # entitlements: build/entitlements.mac.plist
  # entitlementsInherit: build/entitlements.mac.plist

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# afterSign: build/notarize.js

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: build/icon.png
  category: Office
  maintainer: Business OS <support@yourplatform.app>

publish:
  provider: generic
  url: https://updates.yourplatform.app/latest
  channel: latest
